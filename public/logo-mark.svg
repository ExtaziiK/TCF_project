<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 240 116" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Passerelle mark: two open books joined by a bridge, the arch above,
       two rising arrows and « TC ». Lines and gradients only — no raster,
       no background, so no edge to show on any colour. -->
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5F93F2" /><stop offset="1" stop-color="#1F4FB3" />
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E879A8" /><stop offset="1" stop-color="#B3264A" />
    </linearGradient>
    <linearGradient id="arch" x1="54" y1="0" x2="186" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E6BE6" /><stop offset=".55" stop-color="#6C4FE0" /><stop offset="1" stop-color="#B5179E" />
    </linearGradient>
    <linearGradient id="deck" x1="14" y1="0" x2="226" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E6BE6" /><stop offset=".5" stop-color="#6C4FE0" /><stop offset="1" stop-color="#D8354A" />
    </linearGradient>
    <linearGradient id="rise" x1="98" y1="110" x2="150" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6C4FE0" /><stop offset="1" stop-color="#C026D3" />
    </linearGradient>
    <linearGradient id="tc" x1="96" y1="0" x2="160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9333EA" /><stop offset="1" stop-color="#DB2777" />
    </linearGradient>
  </defs>

  <!-- books -->
  <g stroke="url(#blue)">
      <path d="M62.0 66.0Q38.0 54.0 14 62.0V126.0Q38.0 118.0 62.0 126.0" stroke-width="4.0" />
      <path d="M60.0 72.0Q40.0 60.0 20 68.0V123.0Q40.0 120.0 60.0 123.0" stroke-width="3.4" />
      <path d="M58.0 78.0Q42.0 66.0 26 74.0V120.0Q42.0 122.0 58.0 120.0" stroke-width="2.8" />
      <path d="M62 64V128" stroke-width="4" />
  </g>
  <g stroke="url(#red)">
      <path d="M178.0 66.0Q202.0 54.0 226 62.0V126.0Q202.0 118.0 178.0 126.0" stroke-width="4.0" />
      <path d="M180.0 72.0Q200.0 60.0 220 68.0V123.0Q200.0 120.0 180.0 123.0" stroke-width="3.4" />
      <path d="M182.0 78.0Q198.0 66.0 214 74.0V120.0Q198.0 122.0 182.0 120.0" stroke-width="2.8" />
      <path d="M178 64V128" stroke-width="4" />
  </g>

  <!-- suspension cables -->
  <g stroke="url(#arch)" stroke-width="1.8" opacity=".85">
    <path d="M66 82.1V110.2" /><path d="M78 69.1V109.3" /><path d="M90 61.2V108.7" /><path d="M102 56.5V108.2" /><path d="M138 56.5V108.2" /><path d="M150 61.2V108.7" /><path d="M162 69.1V109.3" /><path d="M174 82.1V110.2" />
  </g>

  <!-- the arch, with a lighter dashed line along it for the braid -->
  <path d="M54 120A66 66 0 0 1 186 120" stroke="url(#arch)" stroke-width="10" />
  <path d="M54 120A66 66 0 0 1 186 120" stroke="#A895F7" stroke-width="2.4" stroke-dasharray="5 6" opacity=".9" />

  <!-- the deck -->
  <path d="M14 118Q120 102 226 118" stroke="url(#deck)" stroke-width="5" />

  <!-- two rising arrows -->
  <g stroke="url(#rise)" stroke-width="3.6">
    <path d="M98 104Q116 96 136 74" />
    <path d="M127 74H137V84" />
    <path d="M110 110Q130 102 148 84" />
    <path d="M139 84H149V94" />
  </g>

  <!-- « TC », drawn as strokes so it never depends on a font -->
  <g stroke="url(#tc)" stroke-width="4.2">
    <path d="M98 129Q108 122 120 125Q128 127 134 123" />
    <path d="M117 125Q118 137 110 147Q106 150 103 146" />
    <path d="M160 128Q150 120 142 128Q134 140 146 146Q152 148 160 142" />
  </g>
</svg>

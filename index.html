<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Google picks the search-result icon from these, and needs a square whose
      side is a multiple of 48 — /favicon.png is 192. The .ico is a REAL icon
      file: browsers and crawlers probe /favicon.ico even when it is not linked,
      and vercel.json's catch-all rewrite used to answer that probe with this
      very HTML page (200, text/html), which reads as a valid reply rather than
      "not here". A static file at that path wins over the rewrite.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#2563eb" />
    <title>Passerelle · Préparation au TCF Canada</title>
    <meta
      name="description"
      content="Préparez le TCF Canada en ligne : quiz au format officiel des quatre épreuves, TCF blancs chronométrés, analyse IA de l'écrit et de l'oral et suivi de votre niveau CECR."
    />
    <!--
      Social preview cards (Open Graph / Twitter). Social scrapers don't run
      JavaScript, so these need static absolute URLs on the canonical host
      (`npm run check:seo` keeps this file and public/robots.txt on it). Every
      route's own HTML is written from these by scripts/prerender.mjs, and the
      app keeps them in sync on navigation (src/constants/seo.js).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Passerelle TCF Canada" />
    <meta property="og:locale" content="fr_CA" />
    <meta property="og:title" content="Passerelle · Préparation au TCF Canada" />
    <meta
      property="og:description"
      content="Préparez le TCF Canada en ligne : quiz au format officiel des quatre épreuves, TCF blancs chronométrés, analyse IA de l'écrit et de l'oral et suivi de votre niveau CECR."
    />
    <meta property="og:url" content="https://www.tcfpasserelle.com/" />
    <meta property="og:image" content="https://www.tcfpasserelle.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Passerelle — préparez le TCF Canada" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Passerelle · Préparation au TCF Canada" />
    <meta
      name="twitter:description"
      content="Préparez le TCF Canada en ligne : quiz au format officiel des quatre épreuves, TCF blancs chronométrés et suivi de votre niveau CECR."
    />
    <meta name="twitter:image" content="https://www.tcfpasserelle.com/og-image.png" />
    <meta name="twitter:image:alt" content="Passerelle — préparez le TCF Canada" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem">
        <h1>Passerelle · Préparation au TCF Canada</h1>
        <p>
          Passerelle est une plateforme de préparation au TCF Canada : quiz au format officiel des quatre épreuves
          (compréhension orale et écrite, expression orale et écrite), TCF blancs chronométrés, calculateur de scores
          NCLC et suivi de progression. Activez JavaScript pour utiliser l'application.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
